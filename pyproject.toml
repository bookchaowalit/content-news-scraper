[project]
name = "content-news-scraper"
version = "0.1.0"
description = "News domain producer (publisher RSS/Atom capture) and news.v1 read-only API adapter."
requires-python = ">=3.11"  # the shared data-lake runtime (dev extra) needs 3.11
# Runtime pins (previously requirements.txt + constraints.txt; uv.lock now pins the full set).
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "feedparser==6.0.14",
    "lxml==6.1.3",
    # Transitive floors (security): keep any resolution above published advisories.
    "anyio>=4.14.2",
    "idna>=3.15",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff==0.16.9",
    "mypy==2.4.0",
    # Shared lake runtime for the news.v1 API tests, pinned by commit.
    "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/data-lake-core/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]
# Opt-in error reporting for collector runs (news/observability.py); off without SENTRY_DSN.
sentry = ["sentry-sdk>=2.72,<3"]

[tool.uv]
# Scripts and two local packages run from the checkout; not an installable package.
package = false

[tool.coverage.run]
source = ["news", "news_data", "scripts"]

[tool.mypy]
python_version = "3.11"
files = ["news", "news_data", "scripts", "tests"]
explicit_package_bases = true
# Tests import the runner by bare name (sys.path insert of scripts/).
mypy_path = ["scripts"]
# Gradual: bodies are checked (check_untyped_defs) without requiring annotations
# everywhere. New modules are strict (override below).
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["news.observability"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true

# feedparser ships no type information.
[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
